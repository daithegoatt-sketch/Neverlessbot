name: Prepare Bank Cutover

on:
  push:
    branches: [bank-cutover-ready]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message || '', '[cutover-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bank-cutover-ready
      - name: Remove bank listener but keep friendship system
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/genshin/preload.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const { installBankSystem } = require('../bankSystem');", "const { installFriendshipSystem } = require('../friendshipSystem');")
          s = s.replace("    installBankSystem(this);", "    installFriendshipSystem(this);")
          p.write_text(s, encoding='utf-8')
      - name: Validate
        run: node --check src/genshin/preload.js
      - name: Commit cutover patch
        run: |
          git config user.name "Neverless Cutover"
          git config user.email "actions@users.noreply.github.com"
          git add src/genshin/preload.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[cutover-patch] move bank listener out of main bot"
          git push origin HEAD:bank-cutover-ready
